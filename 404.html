<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — Dinesh Kumar S</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0c0f; --text: #eceef2; --muted: #8d94a1; --accent: #c8f169; --accent-ink: #0b0c0f; }
        @media (prefers-color-scheme: light) { :root { --bg: #f6f5f1; --text: #14161a; --muted: #5f6672; --accent: #1f5c3a; --accent-ink: #fff; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 17px/1.6 Inter, system-ui, sans-serif; text-align: center; }
        h1 { margin: 0; font: 700 clamp(5rem, 22vw, 11rem)/1 'Space Grotesk', sans-serif; letter-spacing: -.05em; }
        h1 span { color: var(--accent); }
        p { margin: 12px 0 28px; color: var(--muted); }
        a { display: inline-block; padding: 13px 26px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <main>
        <h1>404<span>.</span></h1>
        <p>This page doesn't exist, or it moved.</p>
        <a href="/">Back to portfolio</a>
    </main>
</body>
</html>
